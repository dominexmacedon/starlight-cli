<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Folder to GitHub</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  #fileList { margin-top: 1rem; }
  li { margin: 0.3rem 0; }
  button { margin-left: 1rem; }
</style>
</head>
<body>
<h1>Upload Folder to GitHub</h1>

<p>Select a folder:</p>
<input type="file" id="folderInput" webkitdirectory directory multiple>

<ul id="fileList"></ul>

<button id="pushBtn">Push to GitHub</button>

<script>
let files = [];
let repo = 'starlight-cli';
let username = 'dominexmacedon';
let branch = 'main';
let token = ''; // prompt later for security

const folderInput = document.getElementById('folderInput');
const fileList = document.getElementById('fileList');
const pushBtn = document.getElementById('pushBtn');

folderInput.addEventListener('change', (e) => {
    files = Array.from(e.target.files);
    fileList.innerHTML = '';
    files.forEach(f => {
        const li = document.createElement('li');
        li.textContent = f.webkitRelativePath;
        fileList.appendChild(li);
    });
});

async function pushFile(path, contentBase64) {
    const url = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
    
    // Check if file exists to get sha
    const res = await fetch(url, {
        headers: { 'Authorization': `token ${token}` }
    });
    let sha;
    if (res.status === 200) {
        const data = await res.json();
        sha = data.sha;
    }

    const body = {
        message: `Upload ${path}`,
        content: contentBase64,
        branch: branch
    };
    if (sha) body.sha = sha;

    const resp = await fetch(url, {
        method: 'PUT',
        headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
    });

    return await resp.json();
}

pushBtn.addEventListener('click', async () => {
    if (files.length === 0) return alert('No files selected');
    token = prompt('Enter your GitHub Personal Access Token:');
    if (!token) return alert('Token required');

    for (const file of files) {
        const text = await file.text();
        const contentBase64 = btoa(unescape(encodeURIComponent(text)));
        const result = await pushFile(file.webkitRelativePath, contentBase64);
        console.log(result);
    }
    alert('Upload complete!');
});
</script>
</body>
</html>
