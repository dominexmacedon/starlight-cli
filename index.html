<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Folders to GitHub</title>
<style>
  body { font-family: system-ui; margin: 2rem; }
  ul { margin-top: 1rem; }
  li { font-size: 0.9rem; }
  button { margin-top: 1rem; }
</style>
</head>
<body>

<h1>Upload Folders to GitHub</h1>

<p>Select a folder (you can select multiple folders one-by-one):</p>
<input type="file" id="folderInput" webkitdirectory multiple>

<ul id="fileList"></ul>

<button id="pushBtn">Push to GitHub</button>

<script>
const username = 'dominexmacedon';
const repo = 'starlight-cli';
const branch = 'main';

let files = [];

const folderInput = document.getElementById('folderInput');
const fileList = document.getElementById('fileList');
const pushBtn = document.getElementById('pushBtn');

folderInput.addEventListener('change', (e) => {
  const newFiles = Array.from(e.target.files);
  files.push(...newFiles);

  fileList.innerHTML = '';
  files.forEach(f => {
    const li = document.createElement('li');
    li.textContent = f.webkitRelativePath;
    fileList.appendChild(li);
  });
});

async function pushFile(token, path, contentBase64) {
  const url = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

  let sha = null;

  // Check if file exists
  const check = await fetch(url, {
    headers: {
      'Authorization': `Bearer ${token}`,
      'X-GitHub-Api-Version': '2022-11-28'
    }
  });

  if (check.status === 200) {
    const data = await check.json();
    sha = data.sha;
  }

  const body = {
    message: `Upload ${path}`,
    content: contentBase64,
    branch
  };
  if (sha) body.sha = sha;

  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'X-GitHub-Api-Version': '2022-11-28'
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || 'Upload failed');
  }

  return res.json();
}

pushBtn.addEventListener('click', async () => {
  if (files.length === 0) return alert('No files selected');

  const token = prompt('Enter GitHub Personal Access Token:');
  if (!token) return alert('Token required');

  try {
    for (const file of files) {
      const text = await file.text();
      const base64 = btoa(unescape(encodeURIComponent(text)));
      await pushFile(token, file.webkitRelativePath, base64);
    }
    alert('All files uploaded successfully!');
  } catch (err) {
    alert('Error: ' + err.message);
  }
});
</script>

</body>
</html>
